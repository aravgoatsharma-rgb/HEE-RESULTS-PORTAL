<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEE Student Portal</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #3b3abe 0%, #7c3aed 100%);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --primary-blue: #007bff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        /* Main Glass Container */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            width: 90%;
            max-width: 750px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            /* Dot Grid Overlay */
            background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 25px 25px;
        }

        /* Top Logo Section */
        .header-top {
            padding: 30px 0 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-box {
            background: white;
            color: #3b3abe;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .portal-label {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* Heading Section */
        .main-heading {
            text-align: center;
            padding: 0 40px;
        }
        h1 {
            font-size: 32px;
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .welcome-txt {
            font-size: 15px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        /* White Action Box */
        .action-box {
            background: #ffffff;
            margin: 0 40px 40px 40px;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            color: #333;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 25px;
            box-sizing: border-box;
            outline-color: var(--primary-blue);
        }

        .check-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }
        .check-btn:hover { background: #0056b3; }

        /* Footer */
        .card-footer {
            text-align: center;
            padding-bottom: 20px;
            font-size: 12px;
            opacity: 0.6;
        }

        /* Result Specific Table */
        .hidden { display: none; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .result-table td { padding: 12px 0; border-bottom: 1px solid #eee; text-align: left; }
        .tag { display: inline-block; padding: 5px 15px; border-radius: 20px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- TOP HEADER AS REQUESTED -->
        <div class="header-top">
            <div class="logo-box">H</div>
            <div class="portal-label">HEE PORTAL</div>
        </div>

        <div class="main-heading">
            <h1>HEAD ENTRANCE EXAM (HEE) 2026<br>RESULT PORTAL</h1>
            <p class="welcome-txt">Welcome, student please enter your roll no below</p>
        </div>

        <!-- INDEX SCREEN -->
        <div id="index">
            <div class="action-box">
                <input type="text" id="rollInp" placeholder="Enter Roll Number (e.g., HEE1234567)">
                <button class="check-btn" onclick="checkData()">Check Results</button>
            </div>
            <div class="card-footer">© 2026 Head Entrance Exam Board.</div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="marksheet" class="hidden">
            <div class="action-box">
                <h3 style="margin-top: 0;">Examination Result</h3>
                <table class="result-table">
                    <tr><td>Name</td><td style="text-align:right;"><b id="outName"></b></td></tr>
                    <tr><td>Roll No</td><td style="text-align:right;"><b id="outRoll"></b></td></tr>
                    <tr><td>Score (60)</td><td style="text-align:right;"><b id="outScore"></b></td></tr>
                    <tr><td>Percentage</td><td style="text-align:right;"><b id="outPerc"></b></td></tr>
                    <tr><td>Rank</td><td style="text-align:right;"><b id="outRank"></b></td></tr>
                </table>
                <div id="status" class="tag"></div>
                <button class="check-btn" style="background:#555; margin-top:20px;" onclick="location.reload()">Back</button>
            </div>
        </div>
    </div>

    <script>
        const studentDB = {
            "HEE001": { name: "Arsh Vaishnav", p: 95, r: "1 / 2", q: false },
            "HEE002": { name: "Atharv Sharma", p: 72, r: "2 / 2", q: false }
        };

        function checkData() {
            const roll = document.getElementById('rollInp').value.trim().toUpperCase();
            const s = studentDB[roll];

            if (s) {
                document.getElementById('outName').innerText = s.name;
                document.getElementById('outRoll').innerText = roll;
                document.getElementById('outScore').innerText = ((s.p / 100) * 60).toFixed(1);
                document.getElementById('outPerc').innerText = s.p + "%";
                document.getElementById('outRank').innerText = s.r;
                
                const st = document.getElementById('status');
                st.innerText = s.q ? "QUALIFIED" : "NOT QUALIFIED";
                st.style.background = s.q ? "#dcfce7" : "#fee2e2";
                st.style.color = s.q ? "#166534" : "#991b1b";

                document.getElementById('index').classList.add('hidden');
                document.getElementById('marksheet').classList.remove('hidden');
            } else {
                alert("Roll No not found!");
            }
        }
    </script>
</body>
</html>
